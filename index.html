<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lihengdao 的个人主页</title>
  <style>
    :root { color-scheme: light; --text: #1f2933; --muted: #637083; --line: #d8dee8; --accent: #0f766e; --page: #eef2f5; --paper: #ffffff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; line-height: 1.7; }
    main { width: min(840px, calc(100% - 32px)); margin: 0 auto; padding: 56px 0; }
    h1 { margin: 0 0 12px; font-size: clamp(34px, 6vw, 56px); line-height: 1.1; letter-spacing: 0; }
    .intro { margin: 0 0 32px; color: var(--muted); font-size: 17px; }
    .post-list { display: grid; gap: 14px; }
    .post { display: block; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 20px; color: inherit; text-decoration: none; box-shadow: 0 14px 36px rgba(31, 41, 51, 0.07); }
    .post strong { display: block; margin-bottom: 6px; color: var(--accent); font-size: 20px; }
    .post span { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>lihengdao 的个人主页</h1>
    <p class="intro">文章与技术笔记。</p>
    <section class="post-list" aria-label="文章列表">
      <a class="post" href="posts/x-client-transaction-id.html">
        <strong>蓝鸟 x-client-transaction-id追溯</strong>
        <span>2026-08-08 · x-client-transaction-id 生成逻辑追溯与实现分析</span>
      </a>
    </section>
  </main>
</body>
</html>
