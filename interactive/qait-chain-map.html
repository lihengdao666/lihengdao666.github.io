function fit(){tx=0;ty=0;scale=1;apply()}document.getElementById('fit').onclick=fit;document.getElementById('reset').onclick=()=>{fit();detail.classList.remove('open');document.querySelectorAll('.node').forEach(e=>e.classList.remove('selected','pulse','dim'));document.querySelectorAll('.edge').forEach(e=>e.classList.remove('dim'))};

let timer=null,idx=0;document.getElementById('play').onclick=function(){if(timer){clearInterval(timer);timer=null;this.textContent='▶ 播放流程';document.querySelectorAll('.node').forEach(e=>e.classList.remove('pulse'));return}this.textContent='Ⅱ 暂停';idx=0;timer=setInterval(()=>{document.querySelectorAll('.node').forEach(e=>e.classList.remove('pulse'));const id=order[idx++];const el=document.querySelector(`[data-id="${id}"]`);el.classList.add('pulse');select(id);if(idx>=order.length){clearInterval(timer);timer=null;this.textContent='▶ 重新播放'}},700)};
select('root');
</script>
</body></html>
